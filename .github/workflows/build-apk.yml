name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug – show repo contents
        run: |
          echo "Repo root contents:"
          ls -la
          echo ""
          echo "Looking for settings.gradle.kts anywhere in the repo:"
          find . -maxdepth 4 -iname "settings.gradle*" -not -path "*/node_modules/*"

      - name: Locate Gradle project root
        id: locate
        run: |
          GRADLE_DIR=$(find . -maxdepth 4 -iname "settings.gradle.kts" -not -path "*/node_modules/*" | head -n1 | xargs dirname || true)
          if [ -z "$GRADLE_DIR" ]; then
            echo "::error::No settings.gradle.kts found anywhere in the repo. The Android project files (settings.gradle.kts, build.gradle.kts, app/) are missing from this commit on GitHub. Re-check what Lovable actually pushed to the 'main' branch."
            exit 1
          fi
          echo "Found Gradle project at: $GRADLE_DIR"
          echo "dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Create .env file
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=placeholder_api_key" > .env
          else
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk